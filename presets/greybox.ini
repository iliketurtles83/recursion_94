# Greybox: plain measuring course for tuning ship movement (use with --env 4).
# Original dart ship, no screen effects that hide speed and drift. Flight keys are left at
# their defaults (your original tuning). Loading a preset resets unlisted keys to defaults.
[Sim]
shipDart=1
intensityOverride=0.3
[Bloom/Post]
bloomIntensity=0.35
zoomBlurOn=0
caOn=0
grainOn=0
vignetteOn=0
